name: Keneflex P0 Regression

on:
  push:
    branches: [ main, p0-500-subject-audit ]
  pull_request:
    branches: [ main ]

jobs:
  story-and-mutation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/prototype-045b-regression.js
      - run: node tests/prototype-045c-release-contract.js
      - run: node tests/prototype-046-50-subjects.js
      - run: node tests/prototype-046-50-mutations.js
      - run: node tests/prototype-046-p0-critical.js
      - run: node tests/ai-story-contract.js
      - run: node tests/conversation-quality-group.js
      - run: node tests/product-catalog-contract.js
      - run: node tests/prototype-047-50-visual-behavior.js
      - name: Run 500-subject story-engine gate
        run: node tests/prototype-050-500-subjects.js

  browser-gate:
    runs-on: ubuntu-latest
    needs: story-and-mutation-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright
      - run: google-chrome --version
      - run: python3 -m http.server 8080 >/tmp/keneflex-http.log 2>&1 &
      - run: node tests/prototype-046-browser-smoke.js
      - run: node tests/prototype-047-full-page-browser.js
      - name: Run 500 recommendation-to-final-cart journeys
        run: node tests/prototype-050-500-cart-browser.js
