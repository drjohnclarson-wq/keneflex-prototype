name: Keneflex P0 Regression

on:
  push:
    branches: [ main, prototype-045-clean, p0-visual-behavior-audit ]
  pull_request:
    branches: [ main ]

jobs:
  story-and-mutation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run legacy canonical story regression
        run: node tests/prototype-045b-regression.js
      - name: Run release-integrity contract regression
        run: node tests/prototype-045c-release-contract.js
      - name: Run 0.4.6 first 50-subject adversarial regression
        run: node tests/prototype-046-50-subjects.js
      - name: Run 0.4.6 second 50-subject one-variable mutation regression
        run: node tests/prototype-046-50-mutations.js
      - name: Run 0.4.7 fifty-subject visual and behavioral gate
        run: node tests/prototype-047-50-visual-behavior.js

  browser-smoke-gate:
    runs-on: ubuntu-latest
    needs: story-and-mutation-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start prototype server
        run: python3 -m http.server 8080 >/tmp/keneflex-http.log 2>&1 &
      - name: Run 10-story headless browser smoke suite
        run: node tests/prototype-046-browser-smoke.js
      - name: Run 0.4.7 full-page visual and language browser gate
        run: node tests/prototype-047-full-page-browser.js
