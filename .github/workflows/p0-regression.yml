name: Keneflex P0 Regression

on:
  push:
    branches: [ main, prototype-045-clean ]
  pull_request:
    branches: [ main ]

jobs:
  story-and-mutation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run canonical story regression
        run: node tests/prototype-045b-regression.js
      - name: Run release-integrity contract regression
        run: node tests/prototype-045c-release-contract.js
