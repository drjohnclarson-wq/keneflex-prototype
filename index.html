<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Keneflex Prototype 0.3</title><style>
:root{--ink:#17202a;--muted:#667085;--line:#e4e7ec;--soft:#f7f8fa;--accent:#173b57;--ok:#edf7f1}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f5f7;color:var(--ink)}.shell{max-width:680px;margin:0 auto;min-height:100vh;background:#fff;padding:26px 22px 80px}.brand{font-weight:800;letter-spacing:.12em;font-size:14px;color:var(--accent)}.tag{font-size:12px;color:var(--muted);margin-top:5px}.progress{height:5px;background:#eef1f4;border-radius:9px;margin:22px 0}.bar{height:100%;width:8%;background:var(--accent);border-radius:9px;transition:.2s}h1{font-size:30px;line-height:1.12;margin:22px 0 12px}h2{font-size:21px;margin:24px 0 10px}p{line-height:1.5}.sub{color:var(--muted);font-size:15px}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:16px;border-radius:12px;margin:10px 0;font-size:16px;cursor:pointer}.choice:hover{border-color:#9aa7b2;background:#fafbfc}.primary{display:block;width:100%;border:0;background:var(--accent);color:white;padding:16px;border-radius:12px;font-weight:700;font-size:16px;margin-top:18px;cursor:pointer}.secondary{display:block;width:100%;border:1px solid var(--line);background:white;color:var(--ink);padding:14px;border-radius:12px;font-weight:700;font-size:15px;margin-top:10px;cursor:pointer}.card{border:1px solid var(--line);border-radius:14px;padding:17px;margin:13px 0}.winner{background:var(--ok);border-color:#cce6d5}.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted);font-weight:700}.why{padding-left:20px;line-height:1.5}.hidden{display:none}.note{font-size:12px;color:var(--muted);margin-top:18px}.alert{background:#fff4e5;border:1px solid #f4d39b;padding:16px;border-radius:12px}.pill{display:inline-block;padding:5px 9px;background:#eef2f6;border-radius:999px;font-size:12px;margin:3px 4px 3px 0}.metric{font-size:13px;color:var(--muted)}input[type=number]{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font-size:16px}.footer{margin-top:32px;border-top:1px solid var(--line);padding-top:16px;font-size:11px;color:#8a94a3}
:root{--ink:#173a3b;--forest:#1e5a52;--sage:#dfece7;--mist:#f4f7f5;--cream:#fbf9f4;--lime:#d9ef73;--line:#d8e2df;--muted:#667673}
body{background:linear-gradient(180deg,#fbfaf6 0%,#f4f8f6 100%)}
header{background:rgba(251,250,246,.94);backdrop-filter:blur(10px)}
.logo{letter-spacing:.16em;color:var(--ink)} .tag{color:var(--muted)}
.brandLine{display:flex;align-items:center;justify-content:space-between;gap:12px}
.protoChip{font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--sage);color:var(--forest);border-radius:999px;padding:7px 10px}
.card{border-color:var(--line);box-shadow:0 8px 24px rgba(23,58,59,.045)}
.winner{background:linear-gradient(145deg,#eef7f3,#fbfaf6);border-color:#c6dcd4}
.primary{background:var(--ink);box-shadow:0 8px 20px rgba(23,58,59,.14)}
.secondary{border-color:#bdceca;color:var(--ink)}
.pill{background:#edf3f0;color:#45635d}
.productHero{margin:14px 0 18px;overflow:hidden;border-radius:22px;background:#e8f0ed;border:1px solid var(--line);position:relative}
.productHero img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.productHero .caption{position:absolute;bottom:10px;left:10px;background:rgba(251,249,244,.92);padding:7px 10px;border-radius:999px;font-size:11px;font-weight:700;color:var(--ink)}
.solutionGrid{display:grid;grid-template-columns:1fr;gap:12px;margin:14px 0}
.solutionItem{display:grid;grid-template-columns:82px 1fr;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
.solutionThumb{width:82px;height:82px;border-radius:14px;overflow:hidden;background:var(--mist);display:flex;align-items:center;justify-content:center}
.solutionThumb img{width:100%;height:100%;object-fit:cover}
.coldIllustration{width:56px;height:70px;border-radius:14px;background:linear-gradient(145deg,#dff4f7,#8dcbd1);border:2px solid #6fb4bd;position:relative;box-shadow:inset 0 0 0 5px rgba(255,255,255,.26)}
.coldIllustration:before,.coldIllustration:after{content:"";position:absolute;background:white;border-radius:4px;opacity:.94}
.coldIllustration:before{width:28px;height:6px;left:12px;top:31px}.coldIllustration:after{width:6px;height:28px;left:23px;top:20px}
.solutionLabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--forest)}
.plan{display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr;align-items:center;gap:5px;margin:18px 0}
.planStep{min-height:86px;background:var(--mist);border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center}
.planStep strong{display:block;font-size:12px;letter-spacing:.06em;color:var(--forest);margin-bottom:6px}.planArrow{text-align:center;color:#79908b;font-size:20px}
.proofCard{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start}
.proofMark{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.proofMark.win{background:#dff1e9;color:#17624e}.proofMark.out{background:#f4ece9;color:#985842}
.methodFlow{display:grid;gap:8px;margin-top:10px}.methodNode{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px}.methodNode strong{color:var(--ink)}
.methodArrow{text-align:center;color:#78908b;font-size:19px;line-height:16px}
.trustStrip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}
.trustPoint{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 7px;text-align:center;font-size:11px;color:var(--muted)}
.trustPoint strong{display:block;color:var(--ink);font-size:12px;margin-bottom:4px}.noAdd{border-left:4px solid var(--lime)}
@media(max-width:520px){.plan{grid-template-columns:1fr}.planArrow{transform:rotate(90deg)}.solutionItem{grid-template-columns:70px 1fr}.solutionThumb{width:70px;height:70px}}

</style></head><body><div class='shell'><div class='brand'>KENEFLEX</div><div class='tag'>Prototype 0.3 • six-person validation</div><div class='progress'><div class='bar' id='bar'></div></div><main id='app'></main><div class='footer'>Prototype for consumer-experience research. Not medical diagnosis or treatment.</div></div><script>
let s={step:0,provider:false,existing:false,red:false,loc:'both',stability:'flex',activity:'pickleball',wrist:7.0};
const app=document.getElementById('app'),bar=document.getElementById('bar');
function go(n){s.step=n;bar.style.width=Math.min(100,8+n*10)+'%';render();window.scrollTo(0,0)}
function btn(label,fn){return `<button class='choice' data-fn="${encodeURIComponent(fn)}">${label}</button>`}
function wire(){document.querySelectorAll('[data-fn]').forEach(b=>b.onclick=()=>{Function(decodeURIComponent(b.dataset.fn))();});}
function render(){let h='';
if(s.step===0) h=`<h1>What's bothering you?</h1><p class='sub'>Start with the problem. We'll narrow down what matters.</p>${btn('My wrist or thumb is bothering me','go(1)')}${btn('I already have a product and want to know if I still need something','s.existing=true;go(6)')}${btn('A healthcare provider told me what to use','s.provider=true;go(7)')}`;
if(s.step===1) h=`<h1>First, a quick safety check.</h1><p>Did this start with a significant fall/direct blow, obvious deformity, inability to move the hand, new persistent numbness, or an open wound?</p>${btn('No','s.red=false;go(2)')}${btn('Yes / I’m not sure','s.red=true;go(99)')}`;
if(s.step===2) h=`<h1>Where is the problem mainly?</h1>${btn('Mostly my thumb','s.loc="thumb";go(3)')}${btn('Mostly my wrist','s.loc="wrist";go(3)')}${btn('Both wrist and thumb','s.loc="both";go(3)')}`;
if(s.step===3) h=`<h1>What are you trying to do while wearing support?</h1>${btn('Play pickleball / stay active','s.activity="pickleball";go(4)')}${btn('Everyday tasks / work','s.activity="daily";go(4)')}${btn('Rest or sleep','s.activity="rest";go(4)')}`;
if(s.step===4) h=`<h1>How much restriction do you want?</h1><p class='sub'>Choose the closest description.</p>${btn('Keep as much movement as practical','s.stability="flex";go(5)')}${btn('Moderate stabilization','s.stability="moderate";go(5)')}${btn('I need strong stabilization / motion limitation','s.stability="strong";go(5)')}`;
if(s.step===5) h=`<h1>Measure around your wrist.</h1><p class='sub'>Enter inches. This prototype uses manufacturer sizing to avoid recommending an incompatible size.</p><input id='w' type='number' min='4' max='12' step='.1' value='${s.wrist}'><button class='primary' id='continueW'>Continue</button>`;
if(s.step===6) h=`<h1>Let's check what you already own first.</h1><p>For this prototype, assume your current support is the correct product type, still fits, is clean, undamaged, not worn out, and still provides the support you need.</p>${btn('Yes — that describes mine','go(60)')}${btn('No / I’m not sure','s.existing=false;go(1)')}`;
if(s.step===60) h=`<div class='kicker'>Keneflex recommendation</div><h1>You're already covered.</h1><div class='card winner'><h2>I wouldn't buy another one.</h2><p>Based on what you told me, the product you already own is still appropriate and functional for this need.</p></div><p class='sub'>Keneflex checks what you already have before recommending another purchase.</p><button class='primary' id='finishBtn'>Finish</button>`;
if(s.step===7) h=`<h1>What did your provider specify?</h1>${btn('An exact product','s.provider="exact";go(70)')}${btn('A type of support or required feature','s.provider="features";go(71)')}${btn('Just a general class, such as “wrist brace”','s.provider="broad";go(72)')}`;
if(s.step===70) h=`<div class='kicker'>Provider-directed path</div><h1>We'll follow that exact instruction.</h1><div class='card winner'><h2>Keneflex would source/configure the named product.</h2><p>We would not substitute a different product because it scores better in our system.</p></div><button class='primary' id='finishBtn'>Finish</button>`;
if(s.step===71) h=`<div class='kicker'>Provider-directed path</div><h1>Those requirements become hard constraints.</h1><p>Keneflex would compare only products that satisfy the provider's stated type/features, then personalize within that boundary.</p><button class='primary' id='finishBtn'>Finish</button>`;
if(s.step===72) h=`<div class='kicker'>Provider-directed path</div><h1>We can personalize inside that class.</h1><p>Keneflex would preserve the provider's general instruction, then use fit, intended use and your priorities to choose within it.</p><button class='primary' id='finishBtn'>Finish</button>`;
if(s.step===8){let prod,reason,reject=[]; if(s.stability==='strong'&&s.loc==='thumb'){prod='Mueller Reversible Thumb Stabilizer';reason=['You said limiting thumb movement is a priority.','Its two rigid thumb stays are designed to limit thumb motion while leaving the fingers free.','Your wrist measurement is within the manufacturer’s stated one-size range.'];reject=['Neo G Airflow — more movement-preserving than your stated stabilization need calls for.','FUTURO Deluxe — a moderate-stability option; your scenario calls for stronger thumb motion limitation.'];} else if(s.stability==='moderate'&&s.loc==='thumb'){prod='FUTURO Deluxe Thumb Stabilizer';reason=['Your need is thumb-dominant and you asked for moderate stabilization.','Its two supportive stays stabilize the lower thumb while preserving finger movement.','The architecture avoids moving immediately to maximum restriction.'];reject=['Neo G Airflow — prioritizes flexible compression over the moderate thumb stabilization you requested.','Mueller Reversible — designed for stronger thumb motion limitation than this scenario requires.'];} else if(s.stability==='strong'&&(s.loc==='both'||s.loc==='wrist')){prod='Neo G Stabilized Wrist & Thumb Brace';reason=['You asked for substantial stabilization.','This architecture stabilizes both wrist and thumb rather than relying on flexible compression alone.','We would verify one-size fit carefully before finalizing because fit failures appear in current consumer feedback.'];reject=['Neo G Airflow — preserves more movement than your stated stabilization need calls for.','Thumb-only stabilizers — do not match your combined wrist-and-thumb requirement.'];} else {prod='Neo G Airflow Wrist & Thumb Support';reason=['You said staying active and preserving movement matter.','Its slim, flexible architecture is specifically intended for sporting/occupational activity.','Your measurement can be matched to a manufacturer-defined size rather than a universal fit.'];reject=['FUTURO Deluxe — adds thumb stays that are not justified by this mobility-first scenario.','Mueller Reversible — uses rigid thumb stays to limit motion; more restriction than you asked for.','Neo G Stabilized — stronger combined stabilization and a one-size fit-risk signal; not the first choice when mobility is the priority.'];}
s.product=prod; h=`<div class='kicker'>Your Keneflex solution • specific to you</div><h1>Here's what I'd do.</h1>
<div class='productHero'><img src='https://www.neo-g.com/cdn/shop/files/722-2_R_1800x1800.jpg?v=1725268856' alt='Neo G Airflow Wrist and Thumb Support worn during activity'><div class='caption'>Real product • representative use</div></div>
<div class='solutionGrid'>
  <div class='solutionItem'><div class='solutionThumb'><img src='https://www.neo-g.com/cdn/shop/files/722-2_R_1800x1800.jpg?v=1725268856' alt='Recommended wrist and thumb support'></div><div><div class='solutionLabel'>1 · During activity</div><h2>${prod}</h2><p>Selected to match the support, movement and fit priorities you gave us.</p></div></div>
  <div class='solutionItem'><div class='solutionThumb'><div class='coldIllustration' aria-label='Representative reusable cold pack illustration'></div></div><div><div class='solutionLabel'>2 · After activity</div><h2>Reusable cold pack / wrap</h2><p>A simple recovery component. The illustration is representative; this prototype is testing the solution structure rather than a specific cold-pack brand.</p></div></div>
</div>
<div class='card winner'><div class='kicker'>Why this support fits you</div><ul class='why'>${reason.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class='trustStrip'><div class='trustPoint'><strong>YOU</strong>Your stated needs</div><div class='trustPoint'><strong>EVIDENCE</strong>What we investigated</div><div class='trustPoint'><strong>MATCH</strong>What fits you</div></div>
<div class='plan'><div class='planStep'><strong>PLAY</strong>Use the selected support for the activity you told us matters.</div><div class='planArrow'>→</div><div class='planStep'><strong>AFTER PLAY</strong>Use the cold component if comfortable and appropriate.</div><div class='planArrow'>→</div><div class='planStep'><strong>MONITOR</strong>If the situation changes, the solution should be reconsidered.</div></div>
<div class='card noAdd'><div class='kicker'>What I did not add</div><p><span class='pill'>No sleep aid</span><span class='pill'>No oral analgesic</span><span class='pill'>No supplement</span><span class='pill'>No extra brace</span></p><p class='sub'>More products do not automatically make a better solution.</p></div>
<button class='secondary' id='proofBtn'>See why this support won</button>
<div id='proof' class='hidden'><h2>What I ruled out</h2><div class='card proofCard'><div class='proofMark win'>✓</div><div><div class='kicker'>Our pick</div><strong>${prod}</strong><p class='sub'>Best match to the priorities you gave us.</p></div></div>${reject.map(x=>`<div class='card proofCard'><div class='proofMark out'>×</div><div><div class='kicker'>Ruled out</div><p>${x}</p></div></div>`).join('')}<p class='note'>These are evidence of the decision process, not alternate recommendations.</p></div>
<button class='secondary' id='methodBtn'>How Keneflex built your solution</button>
<div id='method' class='hidden card'><div class='methodFlow'><div class='methodNode'><strong>YOU</strong><br><span class='sub'>Problem + activity + priorities + fit</span></div><div class='methodArrow'>↓</div><div class='methodNode'><strong>KENEFLEX</strong><br><span class='sub'>Product facts + credible evidence + consumer success/failure patterns + use-case matching</span></div><div class='methodArrow'>↓</div><div class='methodNode'><strong>YOUR SOLUTION</strong><br><span class='sub'>What belongs—and what doesn't.</span></div></div><p class='note'>Popularity, affiliate economics and the number of products in the cart do not make something part of your solution.</p></div>
<button class='primary' id='cartBtn'>Put my solution in my cart</button>`;}
if(s.step===90) h=`<h1>Your solution is ready.</h1><p class='sub'>Prototype checkout stops here. Please tell the moderator what you would do next in real life.</p><div class='card'><div class='kicker'>Keneflex solution</div><p><strong>${s.product|| (s.existing?'KEEP — no purchase':'Provider-directed path')}</strong></p>${s.product?`<p>+ Reusable cold pack / wrap<br>+ Simple use plan<br><span class='sub'>No unnecessary add-ons included.</span></p>`:''}</div>`;
if(s.step===99) h=`<div class='alert'><div class='kicker'>Safety first</div><h1>I'd stop here before recommending a product.</h1><p>This answer may warrant evaluation rather than a shopping recommendation. Prototype commerce is intentionally stopped.</p></div>`;
app.innerHTML=h;wire();if(document.getElementById('continueW'))document.getElementById('continueW').onclick=()=>{s.wrist=parseFloat(document.getElementById('w').value||7);go(8)};if(document.getElementById('finishBtn'))document.getElementById('finishBtn').onclick=()=>go(90);if(document.getElementById('proofBtn'))document.getElementById('proofBtn').onclick=()=>document.getElementById('proof').classList.toggle('hidden');if(document.getElementById('methodBtn'))document.getElementById('methodBtn').onclick=()=>document.getElementById('method').classList.toggle('hidden');if(document.getElementById('cartBtn'))document.getElementById('cartBtn').onclick=()=>go(90);}
render();
document.addEventListener('error', function(e){
  if(e.target && e.target.tagName==='IMG'){
    e.target.style.display='none';
    const p=e.target.parentElement;
    if(p && p.classList.contains('solutionThumb')) p.innerHTML='<div style="font-weight:800;color:#355b55;text-align:center;font-size:11px">PRODUCT<br>IMAGE</div>';
  }
}, true);

</script></body></html>
